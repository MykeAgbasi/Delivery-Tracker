<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Driver Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            max-width: 500px;
            width: 100%;
            background: #111;
            border: 1px solid #333;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid #333;
        }
        .header h1 { font-size: 1.4rem; color: #fff; font-weight: normal; }
        .header p { font-size: 0.7rem; color: #888; }
        .status {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.8rem;
            color: #ccc;
        }
        .online { color: #0f0; }
        .offline { color: #f00; }
        .queue-badge {
            background: #333;
            color: #fff;
            padding: 2px 8px;
        }
        .live {
            border: 1px solid #333;
            background: #1a1a1a;
            padding: 4px;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.7rem;
            color: #ff0;
        }
        .gps-box {
            border: 1px solid #333;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            background: #0a0a0a;
        }
        .coords {
            font-family: monospace;
            font-size: 1.1rem;
            color: #0f0;
            word-break: break-word;
        }
        .accuracy, .last-update {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 8px;
        }
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat {
            flex: 1;
            border: 1px solid #333;
            padding: 8px;
            text-align: center;
            background: #0a0a0a;
        }
        .stat-value {
            font-size: 1.3rem;
            color: #0f0;
        }
        .stat-label {
            font-size: 0.65rem;
            color: #aaa;
        }
        .footer {
            font-size: 0.6rem;
            text-align: center;
            color: #666;
            border-top: 1px solid #333;
            padding-top: 12px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <h1>Driver Tracker</h1>
        <p>basic version 1.0</p>
    </div>
    <div class="status">
        <span>📡 <span id="netStatus">Connecting...</span></span>
        <span id="queueBadge" class="queue-badge" style="display:none;"></span>
    </div>
    <div class="live">🔴 LIVE TRACKING</div>
    <div class="gps-box">
        <div class="coords" id="coords">⏳ waiting for GPS</div>
        <div class="accuracy" id="accuracy"></div>
        <div class="last-update" id="lastUpdate"></div>
    </div>
    <div class="stats">
        <div class="stat">
            <div class="stat-value" id="queueCount">0</div>
            <div class="stat-label">offline points</div>
        </div>
        <div class="stat">
            <div class="stat-value" id="syncIcon">🟢</div>
            <div class="stat-label">sync</div>
        </div>
    </div>
    <div class="footer">offline queue | gps high accuracy</div>
</div>

<script type="module">
    console.log("Version 1.0 – basic tracking");

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
    import localforage from "https://cdn.skypack.dev/localforage";

    const firebaseConfig = {
        apiKey: "AIzaSyABCAAh8pr_UEy5y1dXsUlmB_VZFv1loFI",
        authDomain: "delivery-tracking-8a23d.firebaseapp.com",
        databaseURL: "https://delivery-tracking-8a23d-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "delivery-tracking-8a23d",
        storageBucket: "delivery-tracking-8a23d.firebasestorage.app",
        messagingSenderId: "466542316831",
        appId: "1:466542316831:web:c8922c1fbf92db23fe342a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const DRIVER_ID = "driver1";   // change per vehicle

    let syncQueue = [];
    let isOnline = navigator.onLine;
    let lastPosition = null;
    let stopStartTime = null;
    let lastPushTime = 0;
    let watchId = null;
    let trackingEnabled = true;

    const STOP_MOVEMENT_METERS = 30;
    const STOP_MIN_SECONDS = 120;
    const MIN_TIME_MS = 5000;
    const MIN_DISTANCE_METERS = 10;

    function distance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const φ1 = lat1 * Math.PI/180;
        const φ2 = lat2 * Math.PI/180;
        const Δφ = (lat2-lat1) * Math.PI/180;
        const Δλ = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(Δφ/2)**2 + Math.cos(φ1)*Math.cos(φ2)*Math.sin(Δλ/2)**2;
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    function updateUI(lat, lng, accuracy, timestamp, queueSize) {
        if (lat && lng) document.getElementById("coords").innerText = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        if (accuracy) document.getElementById("accuracy").innerHTML = `±${Math.round(accuracy)}m`;
        if (timestamp) document.getElementById("lastUpdate").innerText = new Date(timestamp).toLocaleTimeString();
        document.getElementById("queueCount").innerText = queueSize;
        const qb = document.getElementById("queueBadge");
        if (queueSize > 0) {
            qb.style.display = "inline-block";
            qb.innerText = `📦 ${queueSize}`;
        } else {
            qb.style.display = "none";
        }
        document.getElementById("syncIcon").innerHTML = isOnline ? "🟢" : "🔴";
        document.getElementById("netStatus").innerHTML = isOnline ? "online" : "offline";
        document.getElementById("netStatus").className = isOnline ? "online" : "offline";
    }

    async function pushLiveLocation(loc) {
        await set(ref(db, `drivers/${DRIVER_ID}/live`), {
            latitude: loc.lat, longitude: loc.lng,
            time: loc.readableTime, timestamp: loc.timestamp, accuracy: loc.accuracy
        });
    }
    async function appendToRoute(loc) {
        const routeRef = ref(db, `drivers/${DRIVER_ID}/route`);
        const snap = await get(routeRef);
        let route = snap.val() || [];
        route.push({ lat: loc.lat, lng: loc.lng, time: loc.readableTime, timestamp: loc.timestamp });
        if (route.length > 2000) route = route.slice(-2000);
        await set(routeRef, route);
    }
    async function pushStopEvent(stop) {
        const stopsRef = ref(db, `drivers/${DRIVER_ID}/stops`);
        const snap = await get(stopsRef);
        let stops = snap.val() || [];
        stops.push(stop);
        if (stops.length > 500) stops = stops.slice(-500);
        await set(stopsRef, stops);
    }
    async function queueForSync(data, type = "location") {
        syncQueue.push({ type, data, ts: Date.now() });
        await localforage.setItem("syncQueue", syncQueue);
        updateUI(data.lat, data.lng, data.accuracy, data.timestamp, syncQueue.length);
        if (isOnline) processSyncQueue();
    }
    async function processSyncQueue() {
        if (!isOnline || syncQueue.length === 0) return;
        let success = [];
        for (let i = 0; i < syncQueue.length; i++) {
            try {
                if (syncQueue[i].type === "location") {
                    await pushLiveLocation(syncQueue[i].data);
                    await appendToRoute(syncQueue[i].data);
                } else if (syncQueue[i].type === "stop") {
                    await pushStopEvent(syncQueue[i].data);
                }
                success.push(i);
            } catch(e) { break; }
        }
        for (let i = success.length-1; i >= 0; i--) syncQueue.splice(success[i], 1);
        await localforage.setItem("syncQueue", syncQueue);
        if (syncQueue.length > 0) setTimeout(processSyncQueue, 5000);
        if (syncQueue.length === 0) updateUI(0,0,null,Date.now(),0);
    }
    async function loadQueue() {
        const stored = await localforage.getItem("syncQueue");
        if (stored) syncQueue.push(...stored);
        processSyncQueue();
    }

    async function saveLocation(position) {
        if (!trackingEnabled) return;
        const now = Date.now();
        const loc = {
            lat: position.coords.latitude, lng: position.coords.longitude,
            timestamp: now,
            readableTime: new Date().toLocaleString("en-NG", {timeZone: "Africa/Lagos"}),
            accuracy: position.coords.accuracy
        };
        if (lastPosition && distance(lastPosition.lat, lastPosition.lng, loc.lat, loc.lng) < MIN_DISTANCE_METERS) {
            if (isOnline && (now - lastPushTime) >= MIN_TIME_MS) {
                await pushLiveLocation(loc);
                lastPushTime = now;
            } else if (!isOnline) await queueForSync(loc, "location");
            updateUI(loc.lat, loc.lng, loc.accuracy, now, syncQueue.length);
            return;
        }
        // stop detection
        if (lastPosition) {
            const dist = distance(lastPosition.lat, lastPosition.lng, loc.lat, loc.lng);
            if (dist < STOP_MOVEMENT_METERS) {
                if (!stopStartTime) stopStartTime = now;
                else if (now - stopStartTime >= STOP_MIN_SECONDS * 1000) {
                    await queueForSync({
                        startTime: stopStartTime, endTime: null,
                        location: { lat: lastPosition.lat, lng: lastPosition.lng },
                        driver: DRIVER_ID
                    }, "stop");
                    stopStartTime = null;
                }
            } else {
                if (stopStartTime) {
                    await queueForSync({
                        startTime: stopStartTime, endTime: now,
                        location: { lat: lastPosition.lat, lng: lastPosition.lng },
                        driver: DRIVER_ID
                    }, "stop");
                    stopStartTime = null;
                }
            }
        }
        lastPosition = { lat: loc.lat, lng: loc.lng, timestamp: now };
        if (isOnline && (now - lastPushTime) >= MIN_TIME_MS) {
            await pushLiveLocation(loc);
            await appendToRoute(loc);
            lastPushTime = now;
        } else {
            await queueForSync(loc, "location");
        }
        updateUI(loc.lat, loc.lng, loc.accuracy, now, syncQueue.length);
    }

    function gpsError(err) {
        document.getElementById("coords").innerHTML = `⚠️ error: ${err.message}`;
        document.getElementById("accuracy").innerHTML = "check permissions & https";
    }

    function startTracking() {
        if (watchId) navigator.geolocation.clearWatch(watchId);
        watchId = navigator.geolocation.watchPosition(saveLocation, gpsError, {
            enableHighAccuracy: true, maximumAge: 0, timeout: 10000
        });
    }
    function stopTracking() {
        if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    }

    const controlRef = ref(db, `drivers/${DRIVER_ID}/controls/tracking_enabled`);
    onValue(controlRef, (snap) => {
        const enabled = snap.val();
        if (enabled === false) {
            trackingEnabled = false;
            stopTracking();
            document.getElementById("coords").innerHTML = "⏸ paused by manager";
        } else if (enabled === true) {
            trackingEnabled = true;
            startTracking();
        } else {
            trackingEnabled = true;
            startTracking();
        }
    });

    window.addEventListener("online", () => { isOnline = true; processSyncQueue(); });
    window.addEventListener("offline", () => { isOnline = false; });

    let wakeLock = null;
    async function keepAwake() {
        try {
            wakeLock = await navigator.wakeLock.request("screen");
            document.addEventListener("visibilitychange", async () => {
                if (!document.hidden && !wakeLock) wakeLock = await navigator.wakeLock.request("screen");
            });
        } catch(e) {}
    }

    (async () => {
        await loadQueue();
        const init = await get(controlRef);
        if (init.val() === null) await set(controlRef, true);
        keepAwake();
    })();
</script>
</body>
</html>
